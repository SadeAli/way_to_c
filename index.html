<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The C Path — Learn C, visually</title>
<meta name="description" content="From flipping a bit to inline assembly — learn C in your browser. 73 interactive lessons, quizzes, visualizations and a real GCC compiler. Free. No signup.">
<meta property="og:type" content="website">
<meta property="og:title" content="The C Path — Learn C, visually">
<meta property="og:description" content="From flipping a bit to inline assembly — learn C in your browser. Free. No signup. Real GCC.">
<meta property="og:site_name" content="The C Path">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="The C Path — Learn C, visually">
<meta name="twitter:description" content="From flipping a bit to inline assembly — learn C in your browser. Free. No signup. Real GCC.">
<link rel="icon" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;⚙️&lt;/text&gt;&lt;/svg&gt;">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- ===== Top bar ===== -->
    <header class="topbar">
      <button class="iconbtn menu-toggle" id="menuToggle" aria-label="Toggle navigation" title="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <a href="#/" class="brand">
        <span class="brand-logo">&lt;C&gt;</span>
        <span class="brand-name">The C Path</span>
      </a>
      <div class="topbar-spacer"></div>
      <button class="chip searchchip" id="openPalette" title="Search (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Search</span><kbd>Ctrl K</kbd>
      </button>
      <div class="chip streak" id="streakChip" title="Daily streak">🔥 <span id="streakDays">0</span></div>
      <div class="chip xp" id="xpChip" title="Experience points">
        <span class="lvl-badge" id="lvlBadge">1</span>
        <div class="xpbar"><div class="xpbar-fill" id="xpFill"></div></div>
        <span class="xp-num" id="xpNum">0 XP</span>
      </div>
      <button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark">
        <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- ===== Sidebar ===== -->
    <nav class="sidebar" id="sidebar" aria-label="Course navigation"></nav>
    <div class="scrim" id="scrim"></div>

    <!-- ===== Main content ===== -->
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <!-- Command palette -->
  <div class="palette-overlay" id="paletteOverlay" hidden>
    <div class="palette" role="dialog" aria-label="Search lessons">
      <input type="text" id="paletteInput" placeholder="Search lessons, keywords, topics…" autocomplete="off" spellcheck="false">
      <div class="palette-results" id="paletteResults"></div>
    </div>
  </div>

  <!-- Toast + confetti layers -->
  <div class="toast-layer" id="toastLayer"></div>
  <canvas id="confettiCanvas"></canvas>

  <script>
    /* dev-visible error reporter: surfaces uncaught errors instead of a silent blank page */
    window.addEventListener('error', function (e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;bottom:8px;left:8px;right:8px;z-index:9999;background:#3a1214;color:#ffb4b4;font:12px monospace;padding:8px 12px;border-radius:8px;border:1px solid #a33';
      d.textContent = '⚠ ' + e.message + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno;
      document.body.appendChild(d);
    });
  </script>
  <script src="js/core.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/expects.js"></script>
  <script src="js/gotchas-data.js"></script>
  <script src="lessons/part0.js"></script>
  <script src="lessons/part1.js"></script>
  <script src="lessons/part2.js"></script>
  <script src="lessons/part3.js"></script>
  <script src="lessons/part4.js"></script>
  <script src="lessons/part5.js"></script>
  <script src="lessons/part6.js"></script>
  <script src="lessons/part7.js"></script>
  <script src="lessons/part8.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
